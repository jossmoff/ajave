name: nightly

# Deeper gates, kept off the push path deliberately: a check that makes an
# unrelated change red is a check people learn to bypass. These run on a
# schedule and report, and are allowed to fail without blocking anyone.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: mutation testing
    runs-on: ubuntu-latest
    # The recipe reports and exits 0; this is belt and braces in case a
    # mechanical failure (a bad install, a build break) escapes it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: cargo install cargo-mutants --locked
      - run: just mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out/

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: extractions/setup-just@v2
      # Verdicts must not depend on hash iteration order or leftover state.
      # CLAUDE.md documents this costing +/-15-30 points of unexplained noise;
      # the rule existed and nothing enforced it.
      - run: just determinism

# The corpus regression test is deliberately NOT here.
#
# It runs 6 workers with a 90s per-task budget, and its own comment says "a
# timeout here means something hung rather than that the machine was busy" --
# an assumption that is false on a 2-core shared runner. Both attempts were
# killed by signal after ~2 minutes, which reads as a failure and says nothing.
# CLAUDE.md makes the same point about scoring runs: contention manufactures
# regressions that are not there.
#
# Run it on a machine you control: `just test-corpus`.
