name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The toolchain comes from rust-toolchain.toml, which pins an exact version
# rather than "stable". An unpinned channel drifts between this repo and the
# runner, and with `-D warnings` a lint that ships in a new release turns an
# unrelated change red -- which is how `manual_isolate_lowest_one` failed here
# while `just clippy` passed locally.
#
# Every job runs a `just` recipe rather than an inline command. A local check
# that differs from the remote one is how the two silently drift -- which is
# exactly what happened to `boundaries` and `strategy-docs`, both of which
# still read `crates/roast-*` after the rename and so failed on every run for
# weeks without anyone noticing.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: extractions/setup-just@v2
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just clippy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The corpus test drives the real portfolio, and most engines shell out
      # to Z3. Without it they return UNKNOWN and the test reports 30 tasks
      # "regressed from correct" -- which is the runner missing a dependency,
      # not a regression. Java alone was installed here, so this job could
      # never have passed.
      - run: sudo apt-get update && sudo apt-get install -y z3
      - run: z3 --version
      - uses: extractions/setup-just@v2
      - run: just test

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just boundaries

  strategy-docs:
    name: strategy-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just strategy-docs
