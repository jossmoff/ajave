[workspace]
resolver = "2"
members = ["crates/roast-ir", "crates/roast-models", "crates/roast-frontend", "crates/roast-core", "crates/roast-engines", "crates/roast-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jossmoff/roast"

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

# Every crate inherits this profile; keeping it at the workspace level means
# a new crate gets debug symbols in release builds (needed for the witness
# replay stack traces) without anyone having to remember to set it.
[profile.release]
debug = true
