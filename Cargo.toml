[workspace]
resolver = "2"
members = ["crates/ajave-ir", "crates/ajave-models", "crates/ajave-opt", "crates/ajave-frontend", "crates/ajave-core", "crates/ajave-engines", "crates/ajave-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The minimum toolchain these crates build with. Distinct from
# rust-toolchain.toml, which pins the version *we* develop and test against:
# this one makes cargo fail with "requires rustc 1.98.1" instead of an
# unexplained compile error if someone builds with something older.
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/jossmoff/ajave"

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
cvc5 = { version = "0.4", features = ["static"] }

# Every crate inherits this profile; keeping it at the workspace level means
# a new crate gets debug symbols in release builds (needed for the witness
# replay stack traces) without anyone having to remember to set it.
[profile.release]
debug = true

# Release speed, with the contract assertions left in.
#
# `debug_assert!` is compiled out of `release`, and `debug-assertions` defaults
# to off, so the `MergePolicy` clauses in `core::fixpoint` -- including the
# soundness one, whose violation loses a state and discharges an unexamined
# obligation -- fired only under `cargo test`. Every smoke run, every scoring
# run and every oracle sweep ran unchecked.
#
# Turning them on in `release` is the wrong fix: `merge` is in the hot loop of
# the engine that discharges most of the corpus, so that trades soundness
# checking for timeouts. Instead the label-free oracles (`just oracles`) run
# this profile, because they already sweep real programs and do not need
# competition speed. Scoring stays on `release`.
#
# Ask the binary which one it is: `ajave --build-info`.
[profile.release-checked]
inherits = "release"
debug-assertions = true
